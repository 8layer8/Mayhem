services:
  mayhem:
    build: .
    image: mayhem
    container_name: mayhem
    environment:
      # Required: a long random string used to encrypt the session cookie.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Optional overrides.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PLEX_CLIENT_IDENTIFIER: ${PLEX_CLIENT_IDENTIFIER:-}
      # App title shown in the sidebar, login screen, and browser tab (default: Mayhem).
      APP_TITLE: ${APP_TITLE:-Mayhem}
      # UI scale: small | medium | large | extra-large | full (default: medium).
      # extra-large maximizes the now-playing album art. full uses album art as the
      # now-playing background and disables the visualizer.
      UI_SCALE: ${UI_SCALE:-medium}
      # Show the frequency visualizer on the now-playing screen (default: true).
      VISUALIZER_ENABLED: ${VISUALIZER_ENABLED:-true}
      # Dark overlay on full-screen now-playing (0–100, default: 45). Only when UI_SCALE=full.
      FULL_SCREEN_FADE_PERCENT: ${FULL_SCREEN_FADE_PERCENT:-45}
    volumes:
      - mayhem-data:/data
    restart: unless-stopped
    networks:
      - net
      - traefik-public
    deploy:
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public
        - traefik.constraint-label=traefik-public
        - traefik.http.routers.mayhem-http.rule=Host(`${DOMAIN?Variable not set}`)
        - traefik.http.routers.mayhem-http.entrypoints=http
        - traefik.http.routers.mayhem-http.middlewares=https-redirect
        - traefik.http.routers.mayhem-https.rule=Host(`${DOMAIN?Variable not set}`)
        - traefik.http.routers.mayhem-https.entrypoints=https
        - traefik.http.routers.mayhem-https.tls=true
        - traefik.http.routers.mayhem-https.tls.certresolver=le
        - traefik.http.services.mayhem.loadbalancer.server.port=8080

networks:
  net:
    driver: overlay
    attachable: true
  traefik-public:
    external: true

volumes:
  mayhem-data:
  
